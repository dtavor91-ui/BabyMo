name: Build BabyMo APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir project
          unzip BabyMo-source.zip -d project
          echo "PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -1)" >> "$GITHUB_ENV"
      - name: Fix MediaType
        run: |
          FILE=$(find project -name MainActivity.kt | head -1)
          sed -i 's/MediaType.parse(\([^)]*\))/\1.toMediaTypeOrNull()/g' "$FILE"
          if ! grep -q '^import okhttp3.MediaType.Companion.toMediaTypeOrNull$' "$FILE"; then
            sed -i '/^package /a import okhttp3.MediaType.Companion.toMediaTypeOrNull' "$FILE"
          fi
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BabyMo-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
